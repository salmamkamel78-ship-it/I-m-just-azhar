<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azhar - فقه شافعي ادبي كامل</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff2e8f">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#ffe9f3;color:#4a1e33;padding-bottom:110px}
.top{padding:22px 18px 6px;background:linear-gradient(180deg,#ffd1e6,#ffe9f3);position:relative}
.top h1{font-size:27px;margin:10px 0 4px}.top h1 span{color:#ff2e8f}.top p{color:#8a5a71;margin:0;font-size:14px;line-height:1.6}
.card{background:white;margin:10px 16px;border-radius:26px;padding:16px;box-shadow:0 10px 26px rgba(255,46,143,.12);cursor:pointer}
.card small{background:#ffe9f3;color:#ff2e8f;padding:5px 10px;border-radius:999px;font-weight:800;font-size:12px}
.card h2{margin:9px 0 4px;font-size:19px}.card p{margin:0;color:#8a5a71;font-size:13.5px;line-height:1.6}
.detail{display:none;background:white;margin:0 16px 12px;border-radius:26px;padding:18px;box-shadow:0 10px 26px rgba(255,46,143,.14)}
.detail.open{display:block}
.q{background:#fff7fa;border:1.5px solid #ffd1e6;border-radius:20px;padding:14px;margin:11px 0}
.q b{color:#ff2e8f;font-size:15px}.q h3{margin:0 0 8px;color:#ff2e8f;font-size:16px}
.q p,.q li{font-size:14.5px;line-height:1.95}ul,ol{padding-right:18px;margin:5px 0}
.note{background:#ffe9f3;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.8;margin-top:8px}
.btn{border:0;width:calc(100% - 32px);margin:8px 16px;background:#ff2e8f;color:white;padding:14px;border-radius:999px;font-weight:800}
.butterfly{position:absolute;animation:fly 5s ease-in-out infinite}@keyframes fly{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.nav{position:fixed;bottom:14px;left:16px;right:16px;background:rgba(255,255,255,.95);border-radius:28px;display:flex;justify-content:space-around;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);font-size:12px;font-weight:700;color:#b08a9a}.nav .on{color:#ff2e8f}
</style>
</head>
